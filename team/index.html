<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Taj Mahal Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bk:#060606;--bk2:#0e0e0e;--bk3:#161616;--g1:#E8C87A;--g2:#C9A84C;--g3:#8B6914;--wh:#fff;--wh6:rgba(255,255,255,.6);--wh3:rgba(255,255,255,.3);--line:rgba(201,168,76,.18);--red:#d9604c;--grn:#6bbf7a}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bk);color:var(--wh);font-family:'Montserrat',sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:380px;background:var(--bk2);border:1px solid var(--line);padding:40px 32px;text-align:center}
.brand{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:.06em;line-height:1}
.brand b{color:var(--g2);font-weight:400}
.sub{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--g2);margin:10px 0 28px}
.field{width:100%;background:var(--bk);border:1px solid var(--line);padding:14px 16px;font-size:15px;outline:none}
.field:focus{border-color:var(--g2)}
.btn{display:inline-block;background:linear-gradient(180deg,var(--g1),var(--g2) 60%,var(--g3));color:#000;border:0;padding:14px 24px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:none;color:var(--wh);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--g2);color:var(--g1)}
.btn.small{padding:9px 14px;letter-spacing:.14em}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:12px}

/* app */
header.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 32px;border-bottom:1px solid var(--line);background:var(--bk2)}
header.bar .brand{font-size:26px}
header.bar .brand span{font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:.3em;color:var(--g2);margin-left:12px;text-transform:uppercase;vertical-align:middle}
.wrap{max-width:1240px;margin:0 auto;padding:28px 32px 80px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--bk2);border:1px solid var(--line);padding:16px 18px;cursor:pointer;text-align:left}
.stat.on{border-color:var(--g2)}
.stat small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--wh6);margin-bottom:6px}
.stat strong{font-family:'Bebas Neue',sans-serif;font-size:32px;font-weight:400;color:var(--g1)}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tools .field{flex:1;min-width:220px}
.list{display:grid;gap:10px}
.row{background:var(--bk2);border:1px solid var(--line);padding:16px 18px;display:grid;grid-template-columns:1.3fr 1.2fr 1fr auto;gap:16px;align-items:center;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--g2)}
.row .n{font-weight:600;font-size:15px}
.row .m{color:var(--wh6);font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.row .d{color:var(--wh6);font-size:12px}
.pill{display:inline-block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;padding:5px 10px;border:1px solid var(--line)}
.pill.new{color:#000;background:var(--g2);border-color:var(--g2)}
.pill.contacted{color:var(--g1)}
.pill.booked{color:var(--grn);border-color:var(--grn)}
.pill.closed{color:var(--wh3)}
.empty{padding:60px 0;text-align:center;color:var(--wh6);font-size:14px}

/* detail drawer */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bk2);border-left:1px solid var(--line);z-index:51;overflow-y:auto;padding:28px}
.drawer h2{font-family:'Bebas Neue',sans-serif;font-size:34px;font-weight:400;letter-spacing:.04em;margin:4px 0 2px}
.drawer .x{float:right;background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--wh6)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;margin:22px 0;font-size:14px}
.kv dt{color:var(--wh6);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding-top:2px}
.kv dd{overflow-wrap:anywhere;white-space:pre-wrap}
.kv a{color:var(--g1)}
.drawer label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--g2);margin:20px 0 8px}
.drawer textarea{width:100%;min-height:110px;background:var(--bk);border:1px solid var(--line);padding:12px;font-size:14px;outline:none;resize:vertical}
.drawer select{width:100%;background:var(--bk);border:1px solid var(--line);padding:12px;font-size:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}

@media(max-width:760px){
  header.bar,.wrap{padding-left:16px;padding-right:16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:1fr auto;gap:8px}
  .row .ev{display:none}
  .kv{grid-template-columns:1fr}
  .kv dt{padding-top:10px}
}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="login-box" id="loginForm">
    <div class="brand">TAJ <b>MAHAL</b></div>
    <p class="sub">Team Portal</p>
    <input class="field" type="email" id="em" placeholder="Email" autocomplete="username" required style="margin-bottom:10px">
    <input class="field" type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <p class="err" id="loginErr"></p>
    <button class="btn" type="submit" style="width:100%;margin-top:6px">Sign in</button>
  </form>
</div>

<div id="app" class="hidden">
  <header class="bar">
    <div class="brand">TAJ <b>MAHAL</b><span>Leads</span></div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost small" id="csv">Export CSV</button>
      <button class="btn ghost small" id="out">Sign out</button>
    </div>
  </header>
  <main class="wrap">
    <div class="stats" id="stats"></div>
    <div class="tools"><input class="field" id="q" placeholder="Search name, email, organization, message"></div>
    <div class="list" id="list"></div>
  </main>
</div>

<div id="drawerMount"></div>

<script>
(function(){
  var STATUSES=['new','contacted','booked','closed'];
  var leads=[], filter='all', term='';
  var $=function(id){return document.getElementById(id)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var fmt=function(iso){var d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};

  function api(method,body){
    return fetch('/api/leads',{method:method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  }

  function show(authed){
    $('login').classList.toggle('hidden',authed);
    $('app').classList.toggle('hidden',!authed);
  }

  function load(){
    return api('GET').then(function(r){
      if(r.status===401){show(false);return null}
      return r.json();
    }).then(function(j){
      if(!j) return;
      if(!j.ok){$('list').innerHTML='<p class="empty">'+esc(j.error||'Could not load leads.')+'</p>';show(true);return}
      leads=j.leads;show(true);render();
    }).catch(function(){show(true);$('list').innerHTML='<p class="empty">Could not reach the server.</p>'});
  }

  function render(){
    var counts={all:leads.length};STATUSES.forEach(function(s){counts[s]=leads.filter(function(l){return l.status===s}).length});
    $('stats').innerHTML=['all'].concat(STATUSES).map(function(s){
      return '<button class="stat'+(filter===s?' on':'')+'" data-f="'+s+'"><small>'+(s==='all'?'All leads':s)+'</small><strong>'+counts[s]+'</strong></button>';
    }).join('');
    var t=term.toLowerCase();
    var rows=leads.filter(function(l){
      if(filter!=='all'&&l.status!==filter) return false;
      return !t||[l.full_name,l.email,l.company,l.message,l.event_type,l.location].join(' ').toLowerCase().indexOf(t)>-1;
    });
    $('list').innerHTML=rows.length?rows.map(function(l){
      return '<button class="row" data-id="'+l.id+'"><div><div class="n">'+esc(l.full_name)+'</div><div class="m">'+esc(l.email)+(l.company?' &middot; '+esc(l.company):'')+'</div></div>'+
        '<div class="ev"><div class="m" style="margin:0">'+esc(l.event_type||'No event type')+'</div><div class="d">'+esc([l.budget,l.location].filter(Boolean).join(' &middot; '))+'</div></div>'+
        '<div class="d">'+esc(fmt(l.created_at))+'</div><span class="pill '+l.status+'">'+l.status+'</span></button>';
    }).join(''):'<p class="empty">'+(leads.length?'No leads match.':'No leads yet. New contact form submissions will show up here.')+'</p>';
  }

  function openLead(id){
    var l=leads.filter(function(x){return x.id===id})[0];if(!l) return;
    var kv=[['Email','<a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a>'],['Phone',l.phone?'<a href="tel:'+esc(l.phone)+'">'+esc(l.phone)+'</a>':''],['Organization',esc(l.company)],['Event type',esc(l.event_type)],['Event date',esc(l.event_date)],['Budget',esc(l.budget)],['Location',esc(l.location)],['Received',esc(fmt(l.created_at))],['Message',esc(l.message)]]
      .filter(function(p){return p[1]}).map(function(p){return '<dt>'+p[0]+'</dt><dd>'+p[1]+'</dd>'}).join('');
    $('drawerMount').innerHTML='<div class="shade" id="shade"></div><aside class="drawer"><button class="x" id="dx" aria-label="Close">&times;</button>'+
      '<p class="sub" style="margin:0">Lead</p><h2>'+esc(l.full_name)+'</h2><dl class="kv">'+kv+'</dl>'+
      '<label for="st">Status</label><select id="st">'+STATUSES.map(function(s){return '<option value="'+s+'"'+(s===l.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'+
      '<label for="nt">Internal notes</label><textarea id="nt" placeholder="Calls, follow ups, quotes...">'+esc(l.notes)+'</textarea>'+
      '<div class="acts"><button class="btn" id="save">Save</button><a class="btn ghost" style="text-decoration:none" href="mailto:'+esc(l.email)+'">Reply by email</a><button class="btn ghost" id="del" style="margin-left:auto;color:var(--red)">Delete</button></div><p class="err" id="derr"></p></aside>';
    var close=function(){$('drawerMount').innerHTML=''};
    $('shade').onclick=close;$('dx').onclick=close;
    $('save').onclick=function(){
      var b=$('save');b.disabled=true;b.textContent='Saving';
      api('PATCH',{id:l.id,status:$('st').value,notes:$('nt').value}).then(function(r){return r.json()}).then(function(j){
        if(!j.ok) throw 0;l.status=$('st').value;l.notes=$('nt').value;render();close();
      }).catch(function(){b.disabled=false;b.textContent='Save';$('derr').textContent='Could not save. Try again.'});
    };
    $('del').onclick=function(){
      if(!confirm('Delete this lead permanently?')) return;
      api('DELETE',{id:l.id}).then(function(r){return r.json()}).then(function(j){
        if(!j.ok) throw 0;leads=leads.filter(function(x){return x.id!==l.id});render();close();
      }).catch(function(){$('derr').textContent='Could not delete. Try again.'});
    };
  }

  function csv(){
    var cols=['created_at','full_name','email','phone','company','event_type','event_date','budget','location','message','status','notes'];
    var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
    var out=[cols.join(',')].concat(leads.map(function(l){return cols.map(function(c){return q(l[c])}).join(',')})).join('\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/csv'}));a.download='taj-mahal-leads.csv';a.click();
  }

  $('stats').addEventListener('click',function(e){var b=e.target.closest('.stat');if(b){filter=b.dataset.f;render()}});
  $('list').addEventListener('click',function(e){var b=e.target.closest('.row');if(b) openLead(Number(b.dataset.id))});
  $('q').addEventListener('input',function(e){term=e.target.value;render()});
  $('csv').onclick=csv;
  $('out').onclick=function(){fetch('/api/login',{method:'DELETE',credentials:'same-origin'}).then(function(){leads=[];show(false)})};
  $('loginForm').addEventListener('submit',function(e){
    e.preventDefault();$('loginErr').textContent='';
    fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value,password:$('pw').value}),credentials:'same-origin'})
      .then(function(r){return r.json()}).then(function(j){if(!j.ok){$('loginErr').textContent=j.error||'Wrong email or password.';return}$('pw').value='';load()})
      .catch(function(){$('loginErr').textContent='Could not reach the server.'});
  });

  load();
})();
</script>
</body>
</html>
